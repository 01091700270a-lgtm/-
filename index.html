<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>성안 급식 — 오늘 뭐 나와?</title>
<meta name="description" content="안산 성안고등학교 급식 메뉴, 영양정보, 알레르기 정보와 학생 선호도 투표를 한 곳에서." />
<meta name="theme-color" content="#1f6f54" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="top">
  <div class="top__inner">
    <p class="top__school" id="schoolName">안산 성안고등학교</p>
    <h1 class="top__title">오늘 뭐 나와?</h1>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="화면 이동">
  <button class="tabs__btn is-on" role="tab" aria-selected="true" data-tab="meal">급식</button>
  <button class="tabs__btn" role="tab" aria-selected="false" data-tab="stats">인기 메뉴</button>
  <button class="tabs__btn" role="tab" aria-selected="false" data-tab="review">의견</button>
</nav>

<main>

  <!-- ===================== 급식 ===================== -->
  <section class="panel is-on" id="panel-meal" role="tabpanel">

    <div class="datebar">
      <button class="datebar__arrow" id="prevDay" aria-label="이전 날">‹</button>
      <div class="datebar__center">
        <p class="datebar__label" id="dateLabel">날짜</p>
        <input type="date" id="datePicker" class="datebar__input" aria-label="날짜 선택" />
      </div>
      <button class="datebar__arrow" id="nextDay" aria-label="다음 날">›</button>
    </div>
    <button class="today-btn" id="todayBtn" hidden>오늘로 돌아가기</button>

    <div class="mealtype" id="mealType" role="group" aria-label="끼니 선택"></div>

    <div id="mealArea" aria-live="polite">
      <p class="state">급식 정보를 불러오는 중입니다.</p>
    </div>

    <details class="myallergy" id="allergyBox">
      <summary>내 알레르기 표시하기</summary>
      <p class="myallergy__help">해당하는 항목을 고르면 그 재료가 들어간 메뉴에 표시가 붙습니다. 선택 내용은 이 기기에만 저장됩니다.</p>
      <div class="myallergy__list" id="allergyChoices"></div>
    </details>

  </section>

  <!-- ===================== 인기 메뉴 ===================== -->
  <section class="panel" id="panel-stats" role="tabpanel" hidden>
    <div id="statsArea" aria-live="polite">
      <p class="state">투표 결과를 불러오는 중입니다.</p>
    </div>
  </section>

  <!-- ===================== 의견 ===================== -->
  <section class="panel" id="panel-review" role="tabpanel" hidden>

    <form class="review-form" id="reviewForm">
      <h2 class="section-title">오늘 급식 어땠어?</h2>
      <div class="stars" id="starPicker" role="radiogroup" aria-label="만족도 점수"></div>
      <textarea id="reviewText" maxlength="200" rows="3"
        placeholder="더 자주 나왔으면 하는 메뉴, 아쉬웠던 점을 적어주세요."></textarea>
      <div class="review-form__foot">
        <span class="counter" id="reviewCount">0 / 200</span>
        <button type="submit" class="btn-primary">의견 남기기</button>
      </div>
      <p class="form-msg" id="reviewMsg" role="status"></p>
    </form>

    <h2 class="section-title">학생들이 남긴 의견</h2>
    <div id="reviewList" aria-live="polite">
      <p class="state">불러오는 중입니다.</p>
    </div>
  </section>

</main>

<footer class="foot">
  <p>급식 정보 출처: 교육부 NEIS 교육정보 개방 포털</p>
  <p id="storageMode"></p>
</footer>

<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/neis.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
